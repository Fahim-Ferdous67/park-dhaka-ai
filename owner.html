<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkDhaka | Owner Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-800 text-white font-sans h-screen flex flex-col overflow-hidden relative">

    <div id="notification-toast" class="absolute top-20 right-4 bg-green-500 text-white font-bold px-6 py-4 rounded-lg shadow-2xl transform translate-x-full transition-transform duration-300 z-50 flex items-center gap-3">
        <span class="text-2xl">🔔</span>
        <div>
            <p class="text-sm">New Online Booking!</p>
            <p class="text-xs font-normal text-green-100">Slot reserved by user.</p>
        </div>
    </div>

    <header class="bg-gray-900 p-4 shadow-lg flex justify-between items-center z-40 relative">
        <div>
            <h1 class="text-xl font-bold text-blue-400">🅿️ Lot Manager</h1>
            <p class="text-xs text-gray-400 mt-1">Gulshan 1 Plaza</p>
        </div>
        
        <div class="flex items-center gap-2 bg-gray-700/50 px-3 py-1.5 rounded-full border border-gray-600 shadow-inner">
            <div class="bg-gray-300 rounded-full p-1 flex-shrink-0">
                <svg class="w-5 h-5 text-gray-800" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
                </svg>
            </div>
            <div class="text-left text-white">
                <p class="text-sm font-bold leading-none">Shafin</p>
                <p class="text-[10px] text-gray-400 mt-1 leading-none tracking-wide">01758970619</p>
            </div>
        </div>
    </header>

    <div class="flex-grow flex flex-col items-center justify-center p-6 space-y-8 z-10 relative">
        <div class="text-center">
            <h2 class="text-7xl font-extrabold text-white transition-all duration-300" id="slot-counter">12</h2>
            <p class="text-gray-400 mt-3 uppercase tracking-widest text-sm font-bold">Available Slots</p>
            <p id="sync-status" class="text-[10px] text-gray-500 mt-2 animate-pulse">📡 Live Sync Active</p>
        </div>

        <div class="w-full max-w-sm space-y-4">
            <button onclick="updateSlots('entered')" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-6 rounded-xl text-xl shadow-lg active:scale-95 transition-transform">
                🚗 Car Entered (-1)
            </button>
            <button onclick="updateSlots('left')" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-6 rounded-xl text-xl shadow-lg active:scale-95 transition-transform">
                🚙 Car Left (+1)
            </button>
        </div>
        
        <p id="status-message" class="text-yellow-400 text-sm hidden">Sending update to server...</p>
    </div>

    <script>
        // 1. PASTE YOUR GOOGLE SHEETS CSV LINK HERE
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTy5C8jLyJ5P9OXK6FB6dBGVVNG4UHMtfASkZQUyQ3N7grNU88bTfJIVQlskXxBXfXAdPhe4XmL2QN7/pubhtml?gid=0&single=true";
        
        // 2. PASTE YOUR MAKE.COM WEBHOOK URL HERE
        const WEBHOOK_URL = "https://hook.us2.make.com/qsmmzapt7po2qfmknku41ju6n3p5ppf4";

        // FUNCTION 1: Sending manual guard taps to Make.com
        function updateSlots(action) {
            document.getElementById('status-message').classList.remove('hidden');
            
            let counter = document.getElementById('slot-counter');
            let currentVal = parseInt(counter.innerText);
            let newVal = currentVal;
            
            if(action === 'entered' && currentVal > 0) newVal = currentVal - 1;
            if(action === 'left') newVal = currentVal + 1;
            
            counter.innerText = newVal; 

            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    "lot_id": 1,
                    "action": action,
                    "new_slots": newVal
                })
            }).then(() => {
                setTimeout(() => {
                    document.getElementById('status-message').classList.add('hidden');
                }, 1000);
            }).catch(err => console.error(err));
        }

        // FUNCTION 2: The "Live Sync" Hack (Checks database every 3 seconds)
        setInterval(async () => {
            if (SHEET_CSV_URL === "YOUR_CSV_LINK_HERE") return; // Skip if no link

            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();
                
                if (!data.trim().startsWith('<')) {
                    const rows = data.split('\n').slice(1);
                    const myLot = rows.find(r => r.startsWith('1,')); // Looks for Lot ID 1
                    
                    if (myLot) {
                        const dbSlots = parseInt(myLot.split(',')[3]);
                        const counterEl = document.getElementById('slot-counter');
                        const currentSlots = parseInt(counterEl.innerText);

                        // If the database has FEWER slots than the screen shows, a customer booked!
                        if (dbSlots < currentSlots) {
                            showNotification();
                            
                            // Make the number pop visually
                            counterEl.classList.add('text-green-400', 'scale-110');
                            setTimeout(() => {
                                counterEl.classList.remove('text-green-400', 'scale-110');
                            }, 1000);
                        }
                        
                        // Always keep the UI matched with the true database number
                        counterEl.innerText = dbSlots;
                    }
                }
            } catch (error) {
                console.log("Sync error", error);
            }
        }, 3000); // 3000 milliseconds = 3 seconds

        function showNotification() {
            const toast = document.getElementById('notification-toast');
            toast.classList.remove('translate-x-full'); // Slide in
            
            // Slide out after 4 seconds
            setTimeout(() => {
                toast.classList.add('translate-x-full');
            }, 4000);
        }
    </script>
</body>

                })
            }).then(() => {

            }).catch(err => console.error(err));
        }
    </script>
</body>
</html>
