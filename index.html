<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkDhaka | Find Parking</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans pb-10">

    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-bold">🅿️ ParkDhaka</h1>
        <button onclick="loadData()" class="text-xs bg-white text-blue-600 px-3 py-1 rounded shadow font-bold active:scale-95 transition">Refresh Live Data</button>
    </header>

    <div class="bg-white p-3 shadow-sm border-b z-40 relative">
        <div class="flex gap-2">
            <input type="text" id="searchInput" onkeyup="filterLots()" placeholder="Where are you going in Dhaka?" class="w-full border rounded p-2 text-sm focus:outline-blue-500 bg-gray-50">
            <button class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-bold shadow hover:bg-blue-700">Search</button>
        </div>
    </div>

    <div class="w-full h-56 bg-gray-300 relative border-b-2 border-gray-400">
        <iframe src="https://maps.google.com/maps?q=dhaka&t=&z=13&ie=UTF8&iwloc=&output=embed" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        <div class="absolute top-2 left-2 bg-white/90 px-2 py-1 text-xs font-bold rounded shadow text-red-600 animate-pulse border border-red-200">
            Live AI Radar Active
        </div>
    </div>

    <div class="p-4 max-w-lg mx-auto space-y-4" id="parking-list">
        <p class="text-center text-gray-500 mt-4">Loading live parking data...</p>
    </div>

    <script>
        // 1. PASTE YOUR GOOGLE SHEETS CSV LINK HERE
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTy5C8jLyJ5P9OXK6FB6dBGVVNG4UHMtfASkZQUyQ3N7grNU88bTfJIVQlskXxBXfXAdPhe4XmL2QN7/pubhtml?gid=0&single=true";
        
        // 2. PASTE YOUR MAKE.COM WEBHOOK URL HERE (The same one from your Owner App)
        const WEBHOOK_URL = "https://hook.us2.make.com/qsmmzapt7po2qfmknku41ju6n3p5ppf4"; 

        const fallbackData = [
            "1,Gulshan 1 Plaza,50,12,60,High risk. Fills in 15 mins due to traffic.",
            "2,Banani Supermarket,30,5,50,Stable. Expected to remain open for 2 hours.",
            "3,Dhanmondi Lake Parking,40,38,40,Plenty of space available right now."
        ];

        async function loadData() {
            const container = document.getElementById('parking-list');
            container.innerHTML = '<p class="text-center text-blue-500 font-bold mt-4 animate-pulse">Syncing with satellite...</p>';

            let rows = fallbackData; 

            try {
                if(SHEET_CSV_URL !== "YOUR_CSV_LINK_HERE") {
                    const response = await fetch(SHEET_CSV_URL);
                    const data = await response.text();
                    if(!data.trim().startsWith('<')) {
                        rows = data.split('\n').slice(1);
                    }
                }
            } catch (error) {
                console.log("Using fallback demo data");
            }

            container.innerHTML = ''; 

            rows.forEach(row => {
                if (!row.trim()) return;
                const cols = row.split(','); 
                if (cols.length < 5) return; 
                
                const id = cols[0]; // Gets the Lot ID for Make.com
                const name = cols[1];
                const total = cols[2];
                const available = cols[3];
                const price = cols[4];
                const prediction = cols.slice(5).join(',').replace(/"/g, ''); 
                
                let cardColor = "border-green-500";
                let statusText = "Available";
                if (parseInt(available) < 15) {
                    cardColor = "border-red-500";
                    statusText = "Almost Full";
                }

                const mapQuery = encodeURIComponent(name + " Dhaka");

                const card = `
                <div class="parking-card bg-white p-4 rounded-lg shadow-sm border-l-4 ${cardColor} transition-all mb-4" data-name="${name.toLowerCase()}">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-gray-800 text-lg">${name}</h3>
                            <p class="text-sm text-gray-500 mt-1">
                                <span class="font-bold text-xl text-black">${available}</span> / ${total} Slots • ${price} BDT/hr
                            </p>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-bold text-gray-500 uppercase tracking-wide block mb-2">${statusText}</span>
                        </div>
                    </div>
                    <div class="mt-3 bg-blue-50 text-blue-800 text-sm p-3 rounded border border-blue-200">
                        <strong>🤖 AI Insights:</strong> ${prediction || "Analyzing..."}
                    </div>
                    
                    <div class="flex justify-between items-center mt-4 pt-3 border-t">
                        <a href="https://www.google.com/maps/search/?api=1&query=${mapQuery}" target="_blank" class="text-blue-600 text-sm font-bold flex items-center hover:underline">
                            📍 Open in Maps
                        </a>
                        <button onclick="bookSpot('${id}', ${available})" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-6 py-2 rounded shadow font-bold">Book Spot</button>
                    </div>
                </div>`;
                container.innerHTML += card;
            });
        }

        function filterLots() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('parking-card');
            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].getAttribute('data-name');
                if (name.includes(input)) cards[i].style.display = "block";
                else cards[i].style.display = "none";
            }
        }

        // THE LIVE BACKEND CONNECTION
        function bookSpot(lotId, currentAvailable) {
            if(parseInt(currentAvailable) <= 0) {
                alert("Sorry, this lot is completely full!");
                return;
            }
            
            // Show processing status
            let btn = event.target;
            let originalText = btn.innerText;
            btn.innerText = "Booking...";
            btn.classList.add("opacity-50", "cursor-not-allowed");

            let newVal = parseInt(currentAvailable) - 1;

            // Send data directly to your Make.com Webhook
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    "lot_id": lotId,
                    "action": "entered", // Tricks the webhook into treating it like a car entering
                    "new_slots": newVal
                })
            }).then(() => {
                alert("✅ Booking Confirmed! Spot secured.");
                loadData(); // Auto-refresh the page to show the new slot count
            }).catch(err => {
                alert("❌ Booking failed. Please check connection.");
                btn.innerText = originalText;
                btn.classList.remove("opacity-50", "cursor-not-allowed");
            });
        }

        window.onload = loadData;
    </script>
</body>
</html>
